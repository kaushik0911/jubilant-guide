[project]
name = "jubilant-guide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.14.0",
    "debugpy>=1.8.20",
    "diskcache>=5.6.3",
    "duckdb>=1.5.2",
    "fastapi>=0.136.3",
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "isort>=8.0.1",
    "locust>=2.44.1",
    "openrouteservice>=2.3.3",
    "osmnx>=2.1.0",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "requests>=2.33.1",
    "shapely>=2.1.2",
    "streamlit>=1.56.0",
    "streamlit-folium>=0.27.1",
    "uvicorn>=0.48.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["package_name"]
src_paths = ["src"]
